<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hồ sơ cá nhân</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <h3 class="text-center mb-4" style="color: var(--ml-dark);">Cập Nhật Hồ Sơ Cá Nhân</h3>
                
                <form th:action="@{/profile/update}" th:object="${profileRequest}" method="post" enctype="multipart/form-data">
                    <div class="text-center mb-4">
                        <img th:if="${session.user.avatarUrl != null}" th:src="${session.user.avatarUrl}" 
                             class="rounded-circle mb-3" style="width: 150px; height: 150px; object-fit: cover; border: 3px solid var(--ml-accent);" alt="Avatar">
                        <i th:unless="${session.user.avatarUrl != null}" class="fas fa-user-circle text-secondary" style="font-size: 150px;"></i>
                        <br>
                        <label for="avatar" class="form-label mt-2 fw-bold">Đổi ảnh đại diện mới:</label>
                        <input type="file" class="form-control" id="avatar" th:field="*{avatar}" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email (không thể đổi)</label>
                        <input type="email" class="form-control" id="email" th:value="${session.user.email}" disabled>
                    </div>

                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-bold">Họ tên</label>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}">
                        <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-bold">Số điện thoại</label>
                        <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại">
                        <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-custom btn-lg">Lưu Thay Đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
