<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đặt Lại Mật Khẩu - NexusShop</title>
</head>
<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="glass-card p-5" style="width: 100%; max-width: 450px;">
        <h2 class="text-center mb-4 fw-bold">Reset Password</h2>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/reset-password}" method="post">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" th:value="${email}" required readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">OTP Code</label>
                <input type="text" name="otp" class="form-control text-center" required placeholder="6-digit OTP" maxlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label">New Password</label>
                <input type="password" name="newPassword" class="form-control" required placeholder="Min. 6 characters" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
    </div>
</section>
</body>
</html>
