<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng Ký Tài Khoản</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <h3 class="text-center mb-4" style="color: var(--ml-dark);">Đăng Ký ML Jewelry</h3>
                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-bold">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Nguyễn Văn A">
                        <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Địa chỉ Email (để nhận mã OTP)</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@gmail.com">
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Ít nhất 6 ký tự">
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-custom">Đăng Ký</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>Đã có tài khoản? <a href="/login" style="color: var(--ml-accent);">Đăng nhập ngay</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
