<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quản Lý Sản Phẩm - NexusShop Admin</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Product Management</h2>
        <a href="/admin/product/create" class="btn btn-primary"><i class="fa-solid fa-plus me-2"></i>Add New Product</a>
    </div>

    <div class="glass-card">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0" style="background: transparent;">
                <thead>
                    <tr>
                        <th class="border-secondary py-3 px-4">ID</th>
                        <th class="border-secondary py-3 px-4">Image</th>
                        <th class="border-secondary py-3 px-4">Name</th>
                        <th class="border-secondary py-3 px-4">Category</th>
                        <th class="border-secondary py-3 px-4">Price</th>
                        <th class="border-secondary py-3 px-4 text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td class="align-middle px-4 border-secondary" th:text="${product.id}">1</td>
                        <td class="align-middle px-4 border-secondary">
                            <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=150&auto=format&fit=crop'}" 
                                 class="rounded" style="width: 50px; height: 50px; object-fit: cover;" alt="Img">
                        </td>
                        <td class="align-middle px-4 border-secondary fw-bold" th:text="${product.name}">Product Name</td>
                        <td class="align-middle px-4 border-secondary">
                            <span class="badge bg-secondary" th:if="${product.category != null}" th:text="${product.category.name}">Cat</span>
                        </td>
                        <td class="align-middle px-4 border-secondary text-primary fw-bold" th:text="${'$' + product.price}">$99.99</td>
                        <td class="align-middle px-4 border-secondary text-end">
                            <a th:href="@{'/admin/product/edit/' + ${product.id}}" class="btn btn-sm btn-outline-light me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                            <a th:href="@{'/admin/product/delete/' + ${product.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')"><i class="fa-solid fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="6" class="text-center py-4 text-muted border-secondary">No products found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
