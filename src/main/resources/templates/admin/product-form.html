<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${product.id == null ? 'Thêm Sản Phẩm' : 'Sửa Sản Phẩm'} + ' - NexusShop'"></title>
</head>
<body>
<section class="d-flex justify-content-center">
    <div class="glass-card p-5 w-100" style="max-width: 700px;">
        <h2 class="mb-4 fw-bold" th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Form</h2>
        
        <form th:action="@{${product.id == null ? '/admin/product/create' : '/admin/product/edit/' + product.id}}" th:object="${product}" method="post">
            
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Price ($)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select th:field="*{category}" class="form-control" style="appearance: auto;">
                    <option value="">-- Select Category --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
                <div th:if="${#lists.isEmpty(categories)}" class="form-text text-warning mt-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> You need to add categories directly in DB since Category CRUD isn't implemented in this basic version.
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
            </div>
            
            <div class="mb-4">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="5"></textarea>
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="/admin/product" class="btn btn-outline-light">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Product</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
