<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quên Mật Khẩu - NexusShop</title>
</head>
<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="glass-card p-5" style="width: 100%; max-width: 450px;">
        <h2 class="text-center mb-4 fw-bold">Forgot Password</h2>
        <p class="text-center text-muted mb-4">Enter your email address to receive an OTP to reset your password.</p>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Reset OTP</button>
            <div class="text-center mt-3">
                 <a href="/login" class="text-muted text-decoration-none small">Back to Login</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
