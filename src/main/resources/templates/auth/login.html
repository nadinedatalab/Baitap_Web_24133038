<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng Nhập</title>
</head>
<body>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <h3 class="text-center mb-4" style="color: var(--ml-dark);">Đăng Nhập ML Jewelry</h3>
                <form th:action="@{/login}" th:object="${loginRequest}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Địa chỉ Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@gmail.com">
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}">
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-custom">Đăng Nhập</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="/forgot-password" style="color: var(--ml-accent);">Quên mật khẩu?</a> | 
                    <a href="/register" style="color: var(--ml-accent);">Đăng ký tài khoản</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
